<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Menumorut</title>
    <script>
        // No-FOUC language bootstrap: set <html lang> early and cloak only
        // a non-English first paint (failsafe reveals after 800ms if JS fails).
        (function () {
            try {
                var m = location.search.match(/[?&]lang=(en|ro|hu)/i);
                var lang = (m && m[1] || localStorage.getItem('menumorut.lang') || 'en').toLowerCase();
                if (['en', 'ro', 'hu'].indexOf(lang) === -1) lang = 'en';
                document.documentElement.lang = lang;
                if (lang !== 'en') {
                    document.documentElement.className += ' i18n-cloak';
                    setTimeout(function () {
                        document.documentElement.classList.remove('i18n-cloak');
                    }, 800);
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">-->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /*

                - fix fonts

         */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Cinzel", serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #0a0a0a;
            overflow-x: hidden;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            filter: grayscale(100%) contrast(120%);
            -webkit-filter: grayscale(100%) contrast(120%);
        }

        .content {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 1rem;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.3),
                    rgba(0, 0, 0, 0));
            z-index: 10;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 400;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            margin-bottom: 1rem;
            padding-left: 0.5em;
            /* Compensate for letter-spacing */
        }

        .tagline {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            opacity: 0.9;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        h1,
        .tagline,
        .nav-links a {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-30px);
            }

            60% {
                transform: translateY(-15px);
            }
        }

        /* Tablet Styles */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 0.4em;
            }

            .tagline {
                font-size: 0.9rem;
            }

            nav {
                padding: 1.5rem;
            }
        }

        /* Mobile Navigation */
        @media screen and (max-width: 640px) {
            .mobile-menu-btn {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 100%;
                max-width: 300px;
                background: rgba(0, 0, 0, 0.9);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 0.3s ease;
                backdrop-filter: blur(10px);
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 1rem;
                padding: 1rem;
            }
        }

        /* Mobile Styles */
        @media screen and (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.3em;
            }

            .tagline {
                font-size: 0.8rem;
                letter-spacing: 0.15em;
            }

            nav {
                padding: 1rem;
            }
        }

        /* Landscape Mode */
        @media screen and (max-height: 480px) and (orientation: landscape) {
            h1 {
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .scroll-indicator {
                bottom: 1rem;
            }
        }

        /* Larger Screens */
        @media screen and (min-width: 1920px) {
            h1 {
                font-size: 4.5rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .logo {
                font-size: 1.4rem;
            }
        }

        .options {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            gap: clamp(2rem, 6vw, 6rem);
            /* Add spacing between items */

        }

        .options a {
            color: white;
            text-decoration: none;
            font-size: 6rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .options a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: white;
            transform: scaleX(1);
            transition: opacity 0.3s ease;
        }

        .options a:hover::after {
            opacity: 0.7;
        }

        @media screen and (max-width: 768px) {
            .options {
                flex-direction: column;
                /* Stack items vertically for smaller screens */
                align-items: center;
                /* Center the items */
                gap: 2rem;
                /* Adjust spacing for smaller screens */
            }
        }

        /* Cart icon in nav */
        nav {
            transition: background-color 0.3s ease;
        }

        .nav-links {
            align-items: center;
        }

        .nav-links .cart {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .nav-links .cart svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
        }

        .nav-links .cart .cart-count {
            font-size: 0.7rem;
            line-height: 1;
            letter-spacing: 0;
        }

        /* No-FOUC cloak (toggled by the head bootstrap for non-English) */
        .i18n-cloak body {
            visibility: hidden;
        }

        /* Keep the text-free background video visible during the cloak so the
           autoplay attempt isn't fired against a hidden element (mobile/iOS
           won't start a non-visible video, which otherwise leaves the poster
           — grapes.jpg — stuck in place until a tap or refresh). */
        .i18n-cloak .video-container {
            visibility: visible;
        }

        /* Language switcher */
        .lang-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            color: #fff;
        }

        .lang-toggle {
            -webkit-appearance: none;
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: 0;
            margin: 0;
            padding: 0;
            font: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: currentColor;
            text-shadow: inherit;
            cursor: pointer;
        }

        .lang-caret {
            width: 9px;
            height: 9px;
            transition: transform 0.2s ease;
        }

        .lang-switch.open .lang-caret {
            transform: rotate(180deg);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 134px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            padding: 6px 0;
            display: none;
            z-index: 1100;
        }

        .lang-switch.open .lang-menu {
            display: block;
        }

        .lang-menu button {

            appearance: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            margin: 0;
            padding: 9px 18px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            text-transform: none;
            text-shadow: none;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }

        .lang-menu button:hover {

        .lang-menu button.is-active {

            color: #111;

        /* Nav turns solid white once past the hero */
        nav.scrolled {

        }

        nav.scrolled .logo,
        nav.scrolled .mobile-menu-btn {

            text-shadow: none;
        }

                text-shadow: none;

            position: relative;
            z-index: 1;
            background: #fff;
            color: #333;

        @media screen and (min-width: 769px) {

                text-align: left;
            }

            .footer-brand {
                text-align: center;
            }

            .footer-hours {
                text-align: right;
            }
        }
    </style>
</head>

    <script>
        // Mobile menu functionality
        const menuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.querySelector('.nav-links');
        const navBar = document.querySelector('nav');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = !navLinks.classList.contains('active');
            navLinks.classList.toggle('active', open);
            menuBtn.textContent = open ? '\u2715' : '\u2630';
            menuBtn.setAttribute('aria-expanded', String(open));
        });

        const closeMenu = () => {
            navLinks.classList.remove('active');
            menuBtn.textContent = '\u2630';
            menuBtn.setAttribute('aria-expanded', 'false');
        };

        // Turn the nav solid white once scrolled past the hero
        window.addEventListener('scroll', () => {
            if (window.scrollY > window.innerHeight - navBar.offsetHeight) {
                navBar.classList.add('scrolled');
            } else {
                navBar.classList.remove('scrolled');
            }
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('nav')) {
                closeMenu();
            }
        });

        // Close menu on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMenu();
            }
        });

        // Background video: nudge autoplay on mobile browsers.
        // The poster (grapes.jpg) shows whenever playback hasn't started, so a
        // blocked autoplay looks like a stuck hero image. We therefore retry
        // play() at every point the element may have just become playable or
        // visible: after the no-FOUC cloak is lifted (i18n:changed), once the
        // media is decodable (loadeddata/canplay), and on first user gesture
        // (Low Power Mode / strict autoplay). rAF defers the retry past the
        // paint that follows cloak removal, so the element is actually visible.
        const bgVideo = document.querySelector('.video-background');
        if (bgVideo) {
            const tryPlay = () => {
                const p = bgVideo.play();
                if (p && typeof p.catch === 'function') p.catch(() => { });
            };
            const tryPlaySoon = () => requestAnimationFrame(tryPlay);
            tryPlay();
            // Re-attempt once the page is revealed and once the media is ready.
            document.addEventListener('i18n:changed', tryPlaySoon);
            bgVideo.addEventListener('loadeddata', tryPlay);
            bgVideo.addEventListener('canplay', tryPlay);
            // Final fallback: a user gesture always satisfies autoplay policies.
            document.addEventListener('touchstart', tryPlay, { once: true });
            document.addEventListener('click', tryPlay, { once: true });
        }

        // Keep the big VISIT / DRINK / SHOP words on one line and on-screen in
        // every language: 6rem is the ceiling, but shrink to fit when a longer
        // translation (e.g. "VIZITEAZĂ", "VÁSÁROLJ") would overflow.
        const optionsEl = document.querySelector('.options');
        const fitOptions = () => {
            if (!optionsEl) return;
            const links = optionsEl.querySelectorAll('a');
            if (!links.length) return;
            const MAX = 96; // 6rem
            const MIN = 24;
            links.forEach((a) => { a.style.fontSize = MAX + 'px'; });
            const avail = (document.documentElement.clientWidth || window.innerWidth) - 32;
            const needed = optionsEl.scrollWidth; // row: words + gaps; column: widest word
            if (needed > avail) {
                const size = Math.max(MIN, Math.floor(MAX * avail / needed));
                links.forEach((a) => { a.style.fontSize = size + 'px'; });
            }
        };

        let fitRAF;
        const scheduleFit = () => {
            cancelAnimationFrame(fitRAF);
            fitRAF = requestAnimationFrame(fitOptions);
        };

        window.addEventListener('resize', scheduleFit);
        window.addEventListener('load', fitOptions);
        document.addEventListener('i18n:changed', scheduleFit);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitOptions);
        }
        scheduleFit();
    </script>
    <script src="assets/js/i18n.js"></script>
