<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menumorut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">-->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /*
           TODO
                - fix fonts
                - find pictures
                - add other pages + pictures
         */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Cinzel", serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: #0a0a0a;
            overflow-x: hidden;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            filter: grayscale(100%) contrast(120%);
            -webkit-filter: grayscale(100%) contrast(120%);
        }

        .content {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 1rem;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.3),
                    rgba(0, 0, 0, 0));
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 400;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            margin-bottom: 1rem;
            padding-left: 0.5em;
            /* Compensate for letter-spacing */
        }

        .tagline {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            opacity: 0.9;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        h1,
        .tagline,
        .logo,
        .nav-links a {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-30px);
            }

            60% {
                transform: translateY(-15px);
            }
        }

        /* Tablet Styles */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 0.4em;
            }

            .tagline {
                font-size: 0.9rem;
            }

            .logo {
                font-size: 1rem;
            }

            nav {
                padding: 1.5rem;
            }
        }

        /* Mobile Navigation */
        @media screen and (max-width: 640px) {
            .mobile-menu-btn {
                display: block;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                width: 100%;
                max-width: 300px;
                background: rgba(0, 0, 0, 0.9);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: right 0.3s ease;
                backdrop-filter: blur(10px);
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 1rem;
                padding: 1rem;
            }
        }

        /* Mobile Styles */
        @media screen and (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.3em;
            }

            .tagline {
                font-size: 0.8rem;
                letter-spacing: 0.15em;
            }

            .logo {
                font-size: 0.9rem;
                letter-spacing: 0.2em;
            }

            nav {
                padding: 1rem;
            }
        }

        /* Landscape Mode */
        @media screen and (max-height: 480px) and (orientation: landscape) {
            h1 {
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .scroll-indicator {
                bottom: 1rem;
            }
        }

        /* Larger Screens */
        @media screen and (min-width: 1920px) {
            h1 {
                font-size: 4.5rem;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .logo {
                font-size: 1.4rem;
            }
        }

        .options {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            gap: 10rem;
            /* Add spacing between items */

        }

        .options a {
            color: white;
            text-decoration: none;
            font-size: 6rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .options a::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: white;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .options a:hover::after {
            transform: scaleX(1);
        }

        @media screen and (max-width: 768px) {
            .options {
                flex-direction: column;
                /* Stack items vertically for smaller screens */
                align-items: center;
                /* Center the items */
                gap: 2rem;
                /* Adjust spacing for smaller screens */
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html" class="logo">MENUMORUT</a>
        <button class="mobile-menu-btn">☰</button>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="story.html">STORY</a>
            <a href="#visit">VISIT</a>
            <a href="#shop">SHOP</a>
        </div>
    </nav>

    <div class="video-container">
        <video class="video-background" autoplay muted loop playsinline poster="grapes.jpg">
            <source src="hero.mp4" type="video/mp4">
        </video>
    </div>

    <div class="content">
        <div class="options">
            <a href="#" data-section="visit">VISIT</a>
            <a href="#" data-section="drink">DRINK</a>
            <a href="#" data-section="shop">SHOP</a>
        </div>
    </div>


    <script>
        // Mobile menu functionality
        const menuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.querySelector('.nav-links');

        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            menuBtn.textContent = navLinks.classList.contains('active') ? '✕' : '☰';
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('nav')) {
                navLinks.classList.remove('active');
                menuBtn.textContent = '☰';
            }
        });

        // Background video: nudge autoplay on mobile browsers
        const bgVideo = document.querySelector('.video-background');
        if (bgVideo) {
            const tryPlay = () => {
                const p = bgVideo.play();
                if (p && typeof p.catch === 'function') p.catch(() => { });
            };
            tryPlay();
            // Retry on first user interaction (covers Low Power Mode / strict autoplay)
            document.addEventListener('touchstart', tryPlay, { once: true });
            document.addEventListener('click', tryPlay, { once: true });
        }
    </script>
</body>

</html>
