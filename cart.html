<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Cart — Menumorut</title>
    <script>
        // No-FOUC language bootstrap (see i18n.js).
        (function () {
            try {
                var m = location.search.match(/[?&]lang=(en|ro|hu)/i);
                var lang = (m && m[1] || localStorage.getItem('menumorut.lang') || 'en').toLowerCase();
                if (['en', 'ro', 'hu'].indexOf(lang) === -1) lang = 'en';
                document.documentElement.lang = lang;
                if (lang !== 'en') {
                    document.documentElement.className += ' i18n-cloak';
                    setTimeout(function () {
                        document.documentElement.classList.remove('i18n-cloak');
                    }, 800);
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Solid sticky header (utility pages have no hero backdrop) */
        .header {
            position: sticky;
            top: 0;
            width: 100%;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
            z-index: 1000;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: clamp(20px, 4vw, 24px);
            color: #111;
            margin-right: auto;
            text-decoration: none;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-left: 60px;
        }

        .nav a {
            color: #222;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            transition: color 0.3s ease;
        }

        .nav .cart {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            position: relative;
        }

        .nav .cart svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
        }

        .nav .cart .cart-count {
            font-size: 11px;
            line-height: 1;
        }

        /* No-FOUC cloak (toggled by the head bootstrap for non-English) */
        .i18n-cloak body {
            visibility: hidden;
        }

        /* Language switcher */
        .lang-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            color: #333;
        }

        .lang-toggle {
            -webkit-appearance: none;
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: 0;
            margin: 0;
            padding: 0;
            font: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: currentColor;
            cursor: pointer;
        }

        .lang-caret {
            width: 9px;
            height: 9px;
            transition: transform 0.2s ease;
        }

        .lang-switch.open .lang-caret {
            transform: rotate(180deg);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 134px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            padding: 6px 0;
            display: none;
            z-index: 1100;
        }

        .lang-switch.open .lang-menu {
            display: block;
        }

        .lang-menu button {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            margin: 0;
            padding: 9px 18px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            text-transform: none;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }

        .lang-menu button:hover {
            background: #f4f3f0;
        }

        .lang-menu button.is-active {
            font-weight: 700;
            color: #111;
        }

        .mobile-menu-btn {
            display: none;
            color: #222;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Page layout */
        main {
            flex: 1 0 auto;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 24px 96px;
            width: 100%;
        }

        .page-title {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: 0.04em;
            text-align: center;
            margin-bottom: 48px;
        }

        .cart-layout {
            max-width: 720px;
            margin: 0 auto;
        }

        /* Line items */
        .cart-row {
            display: grid;
            grid-template-columns: 84px 1fr auto;
            gap: 22px;
            padding: 26px 0;
            border-bottom: 1px solid #eee;
            align-items: start;
        }

        .cart-row:first-child {
            border-top: 1px solid #eee;
        }

        .cart-row-media {
            width: 84px;
            aspect-ratio: 3 / 4;
            background: #eae9e5;
            overflow: hidden;
        }

        .cart-row-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .cart-row-name {
            font-weight: 400;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .cart-row-unit {
            color: #777;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .qty-stepper {
            display: inline-flex;
            align-items: center;
            border: 1px solid #ccc;
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            color: #333;
        }

        .qty-input {
            width: 50px;
            height: 34px;
            text-align: center;
            border: none;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            font-size: 15px;
            -moz-appearance: textfield;
        }

        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .cart-row-remove {
            display: block;
            margin-top: 14px;
            background: none;
            border: none;
            padding: 0;
            color: #999;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }

        .cart-row-line {
            font-size: 16px;
            white-space: nowrap;
            padding-top: 2px;
        }

        /* Empty state */
        .cart-empty {
            text-align: center;
            padding: 40px 0 8px;
        }

        .cart-empty p {
            margin-bottom: 20px;
            color: #666;
        }

        .cart-empty a {
            color: #000;
            text-decoration: underline;
        }

        /* Summary card */
        .cart-summary {
            background: #f7f6f4;
            padding: 28px 24px;
            margin-top: 40px;
        }

        .cart-summary h2 {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .summary-note {
            color: #888;
            font-size: 13px;
            margin: 4px 0 20px;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #000;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
        }

        .checkout-btn.is-disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Footer */
        .footer {
            flex-shrink: 0;
            background: #fff;
            padding: 48px 40px;
            text-align: center;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        .footer a {
            color: #333;
        }

        @media (hover: hover) {
            .nav a:hover {
                opacity: 0.7;
            }

            .checkout-btn:hover {
                opacity: 0.85;
            }
        }

        /* Mobile */
        @media (max-width: 767px) {
            .header {
                padding: 14px 16px;
            }

            .nav {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                height: 100dvh;
                width: 100%;
                max-width: 300px;
                background: rgba(0, 0, 0, 0.92);
                padding: 24px;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 20px;
                margin-left: 0;
                transition: right 0.3s ease;
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
            }

            .nav.active {
                right: 0;
            }

            .nav a {
                color: #fff;
                font-size: 1rem;
                padding: 0.5rem;
            }

            .nav .lang-switch {
                color: #fff;
            }

            .mobile-menu-btn {
                display: block;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo">MENUMORUT</a>
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="primaryNav" data-i18n-attr="aria-label:a11y.menu">☰</button>
        <nav class="nav" id="primaryNav">
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="story.html" data-i18n="nav.story">Story</a>
            <a href="visit.html" data-i18n="nav.visit">Visit</a>
            <a href="shop.html" data-i18n="nav.shop">Shop</a>
            <a href="cart.html" class="cart" aria-label="Cart" data-i18n-attr="aria-label:a11y.cart">
                <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count">0</span>
            </a>
            <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:a11y.language">
                <button type="button" class="lang-toggle" data-lang-toggle aria-haspopup="true" aria-expanded="false">
                    <span data-lang-current>EN</span>
                    <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="lang-menu" role="menu">
                    <button type="button" role="menuitem" data-lang-switch="en" lang="en">English</button>
                    <button type="button" role="menuitem" data-lang-switch="ro" lang="ro">Română</button>
                    <button type="button" role="menuitem" data-lang-switch="hu" lang="hu">Magyar</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="page">
            <h1 class="page-title" data-i18n="cart.title">YOUR CART</h1>

            <div class="cart-empty" data-cart-empty hidden>
                <p data-i18n="cart.empty">Your cart is empty.</p>
                <a href="shop.html" data-i18n="cart.continueShopping">Continue shopping</a>
            </div>

            <div class="cart-layout" data-cart-body hidden>
                <div data-cart-list></div>

                <aside class="cart-summary">
                    <h2 data-i18n="cart.summary">Order Summary</h2>
                    <div class="summary-line">
                        <span data-i18n="cart.subtotal">Subtotal</span>
                        <span data-cart-subtotal>—</span>
                    </div>
                    <p class="summary-note" data-i18n="cart.deliveryNote">Delivery calculated at checkout.</p>
                    <a href="checkout.html" class="checkout-btn" data-cart-checkout data-i18n="cart.checkout">Proceed to Checkout</a>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Menumorut Wines · <a href="index.html" data-i18n="nav.home">Home</a></p>
    </footer>

    <script>
        // Mobile menu (shared pattern, no hero/scroll coupling on this page).
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const nav = document.querySelector('.nav');

        const setMenu = (open) => {
            nav.classList.toggle('active', open);
            mobileMenuBtn.textContent = open ? '\u2715' : '\u2630';
            mobileMenuBtn.setAttribute('aria-expanded', String(open));
        };

        mobileMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setMenu(!nav.classList.contains('active'));
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.header')) setMenu(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setMenu(false);
        });
    </script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/cart.js"></script>
</body>

</html>
