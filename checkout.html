<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Checkout — Menumorut</title>
    <script>
        // No-FOUC language bootstrap (see i18n.js).
        (function () {
            try {
                var m = location.search.match(/[?&]lang=(en|ro|hu)/i);
                var lang = (m && m[1] || localStorage.getItem('menumorut.lang') || 'en').toLowerCase();
                if (['en', 'ro', 'hu'].indexOf(lang) === -1) lang = 'en';
                document.documentElement.lang = lang;
                if (lang !== 'en') {
                    document.documentElement.className += ' i18n-cloak';
                    setTimeout(function () {
                        document.documentElement.classList.remove('i18n-cloak');
                    }, 800);
                }
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Solid sticky header (utility pages have no hero backdrop) */
        .header {
            position: sticky;
            top: 0;
            width: 100%;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
            z-index: 1000;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: clamp(20px, 4vw, 24px);
            color: #111;
            margin-right: auto;
            text-decoration: none;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-left: 60px;
        }

        .nav a {
            color: #222;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            transition: color 0.3s ease;
        }

        .nav .cart {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            position: relative;
        }

        .nav .cart svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
        }

        .nav .cart .cart-count {
            font-size: 11px;
            line-height: 1;
        }

        .i18n-cloak body {
            visibility: hidden;
        }

        .lang-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            color: #333;
        }

        .lang-toggle {
            -webkit-appearance: none;
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: 0;
            margin: 0;
            padding: 0;
            font: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: currentColor;
            cursor: pointer;
        }

        .lang-caret {
            width: 9px;
            height: 9px;
            transition: transform 0.2s ease;
        }

        .lang-switch.open .lang-caret {
            transform: rotate(180deg);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 134px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            padding: 6px 0;
            display: none;
            z-index: 1100;
        }

        .lang-switch.open .lang-menu {
            display: block;
        }

        .lang-menu button {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            margin: 0;
            padding: 9px 18px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            text-transform: none;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }

        .lang-menu button:hover {
            background: #f4f3f0;
        }

        .lang-menu button.is-active {
            font-weight: 700;
            color: #111;
        }

        .mobile-menu-btn {
            display: none;
            color: #222;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Page layout */
        main {
            flex: 1 0 auto;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 24px 96px;
            width: 100%;
        }

        .page-title {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: 0.04em;
            text-align: center;
            margin-bottom: 48px;
        }

        .checkout-layout {
            display: grid;
            gap: 48px;
            align-items: start;
        }

        @media (min-width: 860px) {
            .checkout-layout {
                grid-template-columns: 1fr 340px;
            }
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Delivery options */
        .delivery-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .delivery-option:hover {
            border-color: #999;
        }

        .delivery-option input {
            accent-color: #000;
            width: 18px;
            height: 18px;
        }

        .delivery-name {
            flex: 1;
        }

        .delivery-price {
            color: #555;
            white-space: nowrap;
        }

        .ships-note {
            color: #888;
            font-size: 13px;
            margin-top: 16px;
        }

        /* Summary card */
        .summary-card {
            background: #f7f6f4;
            padding: 28px 24px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .summary-name {
            color: #444;
        }

        .summary-divider {
            border: 0;
            border-top: 1px solid #e2e0db;
            margin: 18px 0;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .summary-line.total {
            font-weight: 700;
            font-size: 18px;
            border-top: 1px solid #ddd;
            padding-top: 14px;
            margin-top: 4px;
        }

        .checkout-empty {
            color: #888;
            font-size: 15px;
        }

        .pay-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #000;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
        }

        .pay-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .secure-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #888;
            font-size: 12px;
            margin-top: 14px;
        }

        .secure-note svg {
            width: 13px;
            height: 13px;
        }

        /* Footer */
        .footer {
            flex-shrink: 0;
            background: #fff;
            padding: 48px 40px;
            text-align: center;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }

        .footer a {
            color: #333;
        }

        @media (hover: hover) {
            .nav a:hover {
                opacity: 0.7;
            }

            .pay-btn:not(:disabled):hover {
                opacity: 0.85;
            }
        }

        /* Mobile */
        @media (max-width: 767px) {
            .header {
                padding: 14px 16px;
            }

            .nav {
                position: fixed;
                top: 0;
                right: -100%;
                height: 100vh;
                height: 100dvh;
                width: 100%;
                max-width: 300px;
                background: rgba(0, 0, 0, 0.92);
                padding: 24px;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 20px;
                margin-left: 0;
                transition: right 0.3s ease;
                -webkit-backdrop-filter: blur(10px);
                backdrop-filter: blur(10px);
            }

            .nav.active {
                right: 0;
            }

            .nav a {
                color: #fff;
                font-size: 1rem;
                padding: 0.5rem;
            }

            .nav .lang-switch {
                color: #fff;
            }

            .mobile-menu-btn {
                display: block;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo">MENUMORUT</a>
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="primaryNav" data-i18n-attr="aria-label:a11y.menu">☰</button>
        <nav class="nav" id="primaryNav">
            <a href="index.html" data-i18n="nav.home">Home</a>
            <a href="story.html" data-i18n="nav.story">Story</a>
            <a href="visit.html" data-i18n="nav.visit">Visit</a>
            <a href="shop.html" data-i18n="nav.shop">Shop</a>
            <a href="cart.html" class="cart" aria-label="Cart" data-i18n-attr="aria-label:a11y.cart">
                <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count">0</span>
            </a>
            <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:a11y.language">
                <button type="button" class="lang-toggle" data-lang-toggle aria-haspopup="true" aria-expanded="false">
                    <span data-lang-current>EN</span>
                    <svg class="lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="lang-menu" role="menu">
                    <button type="button" role="menuitem" data-lang-switch="en" lang="en">English</button>
                    <button type="button" role="menuitem" data-lang-switch="ro" lang="ro">Română</button>
                    <button type="button" role="menuitem" data-lang-switch="hu" lang="hu">Magyar</button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="page">
            <h1 class="page-title" data-i18n="checkout.title">CHECKOUT</h1>

            <div class="checkout-layout">
                <section>
                    <h2 class="section-title" data-i18n="checkout.delivery">Delivery</h2>
                    <div data-delivery-options></div>
                    <p class="ships-note" data-i18n="checkout.shipsNote">We currently ship within Romania and Hungary. Pickup is available at the estate.</p>
                </section>

                <aside class="summary-card">
                    <h2 class="section-title" data-i18n="checkout.summary">Order Summary</h2>
                    <div data-checkout-summary></div>
                    <hr class="summary-divider">
                    <div class="summary-line">
                        <span data-i18n="cart.subtotal">Subtotal</span>
                        <span data-checkout-subtotal>—</span>
                    </div>
                    <div class="summary-line">
                        <span data-i18n="checkout.deliveryFee">Delivery</span>
                        <span data-checkout-deliveryfee>—</span>
                    </div>
                    <div class="summary-line total">
                        <span data-i18n="checkout.total">Total</span>
                        <span data-checkout-total>—</span>
                    </div>
                    <button type="button" class="pay-btn" data-checkout-pay data-i18n="checkout.pay">Pay with card</button>
                    <p class="secure-note">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span data-i18n="checkout.secure">Secure payment via Stripe</span>
                    </p>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Menumorut Wines · <a href="index.html" data-i18n="nav.home">Home</a></p>
    </footer>

    <script>
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const nav = document.querySelector('.nav');

        const setMenu = (open) => {
            nav.classList.toggle('active', open);
            mobileMenuBtn.textContent = open ? '\u2715' : '\u2630';
            mobileMenuBtn.setAttribute('aria-expanded', String(open));
        };

        mobileMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setMenu(!nav.classList.contains('active'));
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.header')) setMenu(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setMenu(false);
        });
    </script>
    <!-- Stripe.js: needed only on this page for the client-only Checkout redirect. -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/cart.js"></script>
</body>

</html>
